
# Development-specific overrides
# Usage: export OKR_APP_DEPLOY_MODE=dev && docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or: ln -sf docker-compose.dev.yml docker-compose.override.yml

# the develop.watch feature still required the User to refresh the page on Streamlit app
# so it is not needed 
services:
  frontend:
    volumes:
      # the bind mount is sufficient and requires the same refresh as develop.watch
      - ./frontend/src:/app/src

    # # Auto-restart frontend on file changes
    # develop:
    #   watch:
    #     - action: sync+restart
    #       path: ./frontend
    #       target: /app
    #       ignore:
    #         - __pycache__/
    #         - "*.pyc"
    ports: []

  backend:
    # Override command for development with hot-reload
    command: ["uvicorn", "okr_api.create_app:create_app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "./src", "--factory"]
    volumes:
      - ./backend/src:/app/src
    ports: []

  db:
    ports: []